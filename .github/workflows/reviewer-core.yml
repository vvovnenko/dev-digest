# reviewer-core suite — the pure review engine (@devdigest/reviewer-core).
# diff → prompt → LLM → grounded findings, with no DB / GitHub / filesystem.
# Tests are hermetic units (the LLM is stubbed). Uses npm (package-lock.json).
#
# server/src/vendor/shared/** is in the path filter because reviewer-core
# aliases @devdigest/shared to it at type-check time.
name: reviewer-core

on:
  push:
    branches: [main]
    paths:
      - 'reviewer-core/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/reviewer-core.yml'
  pull_request:
    paths:
      - 'reviewer-core/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/reviewer-core.yml'

permissions:
  contents: read

concurrency:
  group: reviewer-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reviewer-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reviewer-core/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # Type-aware lint (typescript-eslint, eslint.config.mjs). Warn-only for now.
      - run: npm run lint

      - run: npm test
