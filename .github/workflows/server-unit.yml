# Server unit suite — Fastify API (@devdigest/api), hermetic tests only.
#
# Two jobs:
#  - typecheck: type-check on Linux only — the platform CI and the exported
#    agent-runner both run on. We deliberately do NOT matrix over Windows/macOS:
#    macOS is covered by daily local dev, Windows is not a ship target, and
#    `@ast-grep/napi` is exact-pinned so its native binary only changes on a
#    deliberate version bump.
#    `pnpm typecheck` covers src AND test/ (tsconfig.test.json). It also runs
#    `pnpm arch` + `pnpm arch:stale` (onion layer boundaries) and `pnpm lint`.
#  - unit: the `unit` Vitest project — every test file except `*.it.test.ts`.
#    LLM/git/embeddings are mocked via src/adapters/mocks.ts — no Docker.
#
# DB-backed tests run in server-integration.yml. reviewer-core/** is in the
# path filter because server aliases ../reviewer-core/src at type-check time.
name: server unit

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'

permissions:
  contents: read

concurrency:
  group: server-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server type-checks reviewer-core's RAW source: tsconfig aliases
      # @devdigest/reviewer-core → ../reviewer-core/src, and platform/structured.ts
      # re-exports from it. That source imports `openai`/`zod`, so without
      # reviewer-core's deps installed, tsc fails with TS2307 → cascading
      # unknown→T errors. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - run: pnpm typecheck

      # Onion layer boundaries (.claude/skills/onion-architecture): dependency-cruiser
      # over src + ../reviewer-core/src. Needs reviewer-core's deps (installed above) so
      # `openai`/`zod` resolve. Known violations are frozen in
      # .dependency-cruiser-known-violations.json: a new one fails `arch`; a fixed one
      # still listed fails `arch:stale` — the baseline only shrinks.
      - run: pnpm arch
      - run: pnpm arch:stale

      # Type-aware lint (typescript-eslint, eslint.config.mjs): floating promises,
      # misused promises, non-exhaustive switches. Warn-only for now.
      - run: pnpm lint

  unit:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The unit tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # The `unit` project of vitest.workspace.ts (default timeouts, so a hung
      # test fails fast instead of eating the job).
      - run: pnpm test:unit
