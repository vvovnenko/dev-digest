# Client suite — Next.js web app (@devdigest/web).
# Typecheck + component/unit tests (vitest + jsdom). Hermetic: no API, no DB,
# no browser — the tests mock the hook modules or src/lib/api.ts. The full-stack browser flow lives
# in e2e-web.yml.
name: client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/client.yml'

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Type-aware lint (typescript-eslint, eslint.config.mjs). Warn-only for now.
      - run: pnpm lint

      - run: pnpm test

      # src/vendor/shared is a hand-copy of server/src/vendor/shared (types
      # only here): the two must stay identical.
      - name: Contract copies in sync
        working-directory: .
        run: diff -r server/src/vendor/shared client/src/vendor/shared
